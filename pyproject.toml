[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agt"
version = "0.1.0"
description = "Local AI agent CLI bridge — discover, register, and invoke local AI coding agents (Claude Code, Codex, etc.) from the terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
]

[project.scripts]
agt = "agt.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["agt"]