[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agt-team"
version = "0.1.6"
description = "Local AI agent CLI bridge — discover, register, and invoke local AI coding agents (Claude Code, Codex, etc.) from the terminal."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "half-island-box", email = "182872445+half-island-box@users.noreply.github.com"},
]
dependencies = [
    "click>=8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "websockets>=12.0",
    "pyjwt>=2.8.0",
    "mcp>=1.0.0,<2",
    "pyyaml>=6.0",
]

[project.scripts]
agt = "agt.cli.main:cli"

[dependency-groups]
# Test-only dependencies (pytest + coverage). Kept in a group so ``uv sync``
# installs them for development without shipping them in the wheel.
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "alembic>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agt"]
artifacts = ["agt/web_console/assets/**"]

[tool.pytest.ini_options]
markers = [
    "no_server_secret: tests that run without AGT_SERVER_SECRET configured",
]
