    <path d="M3020 2915 l0 -74 143 -3 142 -3 3 -352 2 -353 80 0 80 0 0 355 0 355 145 0 145 0 0 75 0 75 -370 0 -370 0 0 -75z"/>
    <path d="M2497 2000 c-70 -18 -101 -42 -272 -210 -156 -154 -174 -168 -222 -180 l-53 -14 0 -74 0 -75 55 6 c95 10 137 38 315 212 91 90 175 168 187 174 12 6 38 11 59 11 35 0 48 -11 209 -170 187 -185 239 -220 343 -228 l52 -4 0 75 0 75 -37 7 c-68 12 -107 42 -258 196 -159 161 -208 194 -296 203 -24 3 -61 1 -82 -4z"/>
    <path d="M1765 1810 l-109 -110 54 -55 c30 -30 59 -55 65 -55 6 0 60 49 120 110 l109 110 -54 55 c-30 30 -59 55 -65 55 -6 0 -60 -49 -120 -110z"/>
    <path d="M3170 1865 l-54 -54 19 -23 c45 -54 191 -198 200 -198 6 0 36 24 67 54 l57 54 -110 108 c-60 60 -113 110 -117 112 -4 1 -32 -22 -62 -53z"/>
