<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">AGT — local bridge and orchestrator for AI coding-agent CLIs</title>
  <desc id="description">A dark rectangular project banner showing the AGT mark beside a multi-agent workflow graph.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191C"/>
      <stop offset=".55" stop-color="#1A1D21"/>
      <stop offset="1" stop-color="#202327"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C8A274" stop-opacity=".08"/>
      <stop offset="1" stop-color="#C8A274" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1200" height="400" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1200" height="400" rx="32" fill="url(#background)"/>
  <rect width="1200" height="400" rx="32" fill="url(#grid)"/>

  <circle cx="975" cy="202" r="235" fill="url(#glow)" filter="url(#soft-blur)"/>
  <circle cx="225" cy="295" r="150" fill="#ffffff" opacity=".025" filter="url(#soft-blur)"/>

  <!-- Rounded brand tile -->
  <rect x="70" y="92" width="180" height="180" rx="44" fill="#101214" stroke="#ffffff" stroke-opacity=".10"/>
  <rect x="70" y="92" width="180" height="180" rx="44" fill="url(#panel)"/>
  <g transform="translate(105,103.7) scale(.234375)">
  <g transform="translate(-255,785) scale(.2,-.2)" fill="#ffffff">
    <path d="M2470 3730 l0 -160 85 0 85 0 0 160 0 160 -85 0 -85 0 0 -160z"/>
    <path d="M1948 3595 c3 -67 6 -75 23 -75 51 0 102 -39 269 -205 165 -163 179 -174 234 -190 71 -21 136 -16 198 14 30 14 100 76 199 177 168 169 194 190 257 200 l42 7 0 73 0 74 -47 0 c-94 0 -158 -42 -343 -225 -172 -171 -195 -186 -257 -170 -17 4 -95 73 -203 179 -153 151 -182 176 -233 194 -32 12 -77 22 -100 22 l-42 0 3 -75z"/>
    <path d="M1717 3482 l-57 -58 111 -113 110 -113 53 48 c30 27 56 54 59 60 3 6 -45 61 -107 123 l-111 111 -58 -58z"/>
    <path d="M3227 3432 c-59 -59 -107 -112 -107 -118 0 -5 25 -34 55 -64 l55 -54 115 114 115 115 -57 57 c-32 32 -60 57 -63 58 -3 0 -54 -48 -113 -108z"/>
