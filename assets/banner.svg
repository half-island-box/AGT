  </g>
  </g>

  <!-- Product name and positioning -->
  <text x="294" y="176" fill="#ffffff" font-family="Inter, SF Pro Display, Segoe UI, system-ui, sans-serif" font-size="90" font-weight="800" letter-spacing="-2">agt</text>
  <rect x="294" y="205" width="86" height="5" rx="2.5" fill="#C8A274"/>
  <text x="294" y="263" fill="#dbe4f2" font-family="Inter, SF Pro Text, Segoe UI, system-ui, sans-serif" font-size="29" font-weight="500">A local bridge and orchestrator</text>
  <text x="294" y="303" fill="#94a3b8" font-family="Inter, SF Pro Text, Segoe UI, system-ui, sans-serif" font-size="25" font-weight="400">for AI coding-agent CLIs</text>

  <!-- Workflow motif: CLI / extension / web entrances through the AGT core -->
  <g stroke="#8A9099" stroke-opacity=".42" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M810 135C850 135 850 190 890 190"/>
    <path d="M810 202C850 202 850 206 890 206"/>
    <path d="M810 269C850 269 850 222 890 222"/>
    <path d="M942 206h82"/>
  </g>

  <g font-family="Inter, SF Pro Text, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="700" y="116" width="110" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="755" y="140" fill="#E4E7EB">CLI</text>
    <rect x="700" y="183" width="110" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="755" y="207" fill="#E4E7EB">Extension</text>
    <rect x="700" y="250" width="110" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="755" y="274" fill="#E4E7EB">Web</text>
  </g>

  <rect x="890" y="170" width="52" height="72" rx="20" fill="#101214" stroke="#ffffff" stroke-opacity=".16"/>
  <circle cx="916" cy="192" r="6" fill="#CE7568"/>
  <circle cx="916" cy="212" r="6" fill="#D2A04C"/>
  <circle cx="916" cy="232" r="6" fill="#6FA97C"/>

  <g fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".13" font-family="Inter, SF Pro Text, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="1024" y="116" width="100" height="38" rx="19"/>
    <rect x="1024" y="183" width="100" height="38" rx="19"/>
    <rect x="1024" y="250" width="100" height="38" rx="19"/>
  </g>
  <g font-family="Inter, SF Pro Text, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E4E7EB" text-anchor="middle">
    <text x="1074" y="140">Goal</text>
    <text x="1074" y="207">SOP</text>
    <text x="1074" y="274">Chat</text>
  </g>

  <!-- Capability strip -->
  <g font-family="Inter, SF Pro Text, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="500" fill="#8b99af">
    <text x="715" y="345">Chat</text>
    <text x="790" y="345">·</text>
    <text x="820" y="345">Workflows</text>
    <text x="938" y="345">·</text>
    <text x="968" y="345">Artifacts</text>
    <text x="1078" y="345">·</text>
    <text x="1108" y="345">Routing</text>
  </g>

  <g clip-path="url(#rounded)">
    <rect x="0" y="393" width="1200" height="7" fill="#C8A274" opacity=".58"/>
  </g>
</svg>
