name: Release packages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-changes:
    name: Detect version changes
    runs-on: ubuntu-latest

    outputs:
      python_version: ${{ steps.versions.outputs.python_version }}
      vscode_version: ${{ steps.versions.outputs.vscode_version }}
      python_changed: ${{ steps.versions.outputs.python_changed }}
      vscode_changed: ${{ steps.versions.outputs.vscode_changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compare package versions
        id: versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          base="$BEFORE_SHA"

          # First push and force push fall back to HEAD^.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi

          py_now="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          vs_now="$(node -p "require('./vscode/package.json').version")"

          py_base=""
          if git cat-file -e "${base}:pyproject.toml" 2>/dev/null; then
            py_base="$(git show "${base}:pyproject.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          fi

          vs_base=""
          if git cat-file -e "${base}:vscode/package.json" 2>/dev/null; then
            git show "${base}:vscode/package.json" > "$RUNNER_TEMP/package.base.json"
            vs_base="$(node -p "require(process.argv[1]).version" "$RUNNER_TEMP/package.base.json")"
          fi

          if [[ -n "$py_base" && "$py_now" == "$py_base" ]]; then
            python_changed=false
          else
            python_changed=true
          fi

          if [[ -n "$vs_base" && "$vs_now" == "$vs_base" ]]; then
            vscode_changed=false
          else
            vscode_changed=true
          fi

          {
            echo "python_version=$py_now"
            echo "vscode_version=$vs_now"
            echo "python_changed=$python_changed"
            echo "vscode_changed=$vscode_changed"
          } >> "$GITHUB_OUTPUT"

          echo "Python: ${py_base:-<new>} -> $py_now, publish=$python_changed"
          echo "VS Code: ${vs_base:-<new>} -> $vs_now, publish=$vscode_changed"

  publish-python:
    name: Publish agt-team to PyPI
    runs-on: ubuntu-latest
    needs: detect-version-changes
    if: needs.detect-version-changes.outputs.python_changed == 'true'

    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Install VS Code dependencies
        working-directory: vscode
        run: npm ci

      - name: Rebuild Python web console assets
        working-directory: vscode
        run: npm run build:console

      - name: Ensure generated assets are committed
        run: git diff --exit-code -- agt/web_console/assets

      - name: Sync Python dependencies
        run: uv sync

      - name: Run Python tests
        run: uv run pytest

      - name: Build Python distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-vscode:
    name: Publish AGT VS Code extension
    runs-on: ubuntu-latest
    needs: detect-version-changes
    if: needs.detect-version-changes.outputs.vscode_changed == 'true'

    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: vscode

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@latest publish --no-dependencies --oidc
